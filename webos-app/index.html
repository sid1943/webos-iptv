<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>Optimize</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/player.css" />
  <link rel="stylesheet" href="css/channel-list.css" />
  <link rel="stylesheet" href="css/epg.css" />
  <link rel="stylesheet" href="css/settings.css" />
</head>
<body>
  <!-- Video player (always behind everything) -->
  <div id="player-container">
    <video id="video-player" autoplay></video>
  </div>

  <!-- Info bar (channel name, now/next) -->
  <div id="info-bar" class="overlay hidden">
    <div id="info-bar-logo"></div>
    <div id="info-bar-content">
      <div id="info-bar-number" class="info-number"></div>
      <div id="info-bar-name" class="info-name"></div>
      <div id="info-bar-now" class="info-programme">
        <span class="info-label">Now:</span>
        <span id="info-now-title"></span>
        <span id="info-now-time" class="info-time"></span>
      </div>
      <div id="info-bar-next" class="info-programme">
        <span class="info-label">Next:</span>
        <span id="info-next-title"></span>
        <span id="info-next-time" class="info-time"></span>
      </div>
    </div>
    <div id="info-bar-progress">
      <div id="info-bar-progress-fill"></div>
    </div>
  </div>

  <!-- Channel list sidebar -->
  <div id="channel-sidebar" class="overlay hidden">
    <div id="channel-search">
      <input type="text" id="channel-search-input" placeholder="Search channels..." class="focusable" />
    </div>
    <div id="channel-groups">
      <button class="group-btn focusable active" data-group="all">All</button>
      <button class="group-btn focusable" data-group="favorites">Favorites</button>
      <!-- Groups populated dynamically -->
    </div>
    <div id="channel-list" role="listbox">
      <!-- Channel items populated dynamically -->
    </div>
  </div>

  <!-- EPG grid -->
  <div id="epg-container" class="overlay hidden">
    <div id="epg-header">
      <div id="epg-title">Programme Guide</div>
      <div id="epg-timeline">
        <!-- Time slots populated dynamically -->
      </div>
    </div>
    <div id="epg-grid">
      <!-- EPG rows populated dynamically -->
    </div>
  </div>

  <!-- Direct number input overlay -->
  <div id="number-input" class="overlay hidden">
    <div id="number-input-digits"></div>
    <div id="number-input-channel"></div>
  </div>

  <!-- Settings panel -->
  <div id="settings-panel" class="overlay hidden">
    <div id="settings-content">
      <h1>Settings</h1>
      <div id="settings-sections">
        <!-- Populated dynamically -->
      </div>
    </div>
    <div id="playlist-modal" class="overlay hidden">
      <div class="playlist-modal-card">
        <div class="playlist-modal-title">Add Playlist</div>
        <div class="playlist-modal-field">
          <label for="playlist-name">Name</label>
          <input id="playlist-name" class="settings-input focusable" type="text" placeholder="My Playlist" />
        </div>
        <div class="playlist-modal-field">
          <label for="playlist-url">Playlist URL (M3U/M3U8)</label>
          <input id="playlist-url" class="settings-input focusable" type="text" placeholder="https://example.com/playlist.m3u8" />
        </div>
        <div class="playlist-modal-field">
          <label for="playlist-epg">EPG URL (optional)</label>
          <input id="playlist-epg" class="settings-input focusable" type="text" placeholder="https://example.com/epg.xml" />
        </div>
        <div class="playlist-modal-actions">
          <button id="playlist-cancel" class="settings-btn focusable" data-action="cancel-playlist">Cancel</button>
          <button id="playlist-save" class="settings-btn focusable" data-action="save-playlist">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <!-- Loading spinner -->
  <div id="loading" class="overlay">
    <div class="spinner"></div>
    <div id="loading-text">Loading channels...</div>
  </div>

  <!-- Vendor libs -->
  <script src="lib/webOSTV.js"></script>
  <script src="lib/shaka-player.compiled.js"></script>
  <script src="lib/spatial-navigation.js"></script>

  <!-- App bundle -->
  <script src="js/app.js"></script>
</body>
</html>
